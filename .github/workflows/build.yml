name: build
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth=1 https://github.com/Rohail33/Realking_kernel_sm8550.git k
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev python3 curl rsync zip unzip cpio device-tree-compiler ccache kmod lz4 zstd libncurses-dev clang lld llvm dwarves
          cd k
          make O=out LLVM=1 ARCH=arm64 kalama-gki_stock_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/nuwa_GKI.config
          scripts/config --file out/.config -d TRIM_UNUSED_KSYMS -e MODULE_FORCE_LOAD -e VT -e FRAMEBUFFER_CONSOLE -e DRM_FBDEV_EMULATION -d LTO_CLANG_FULL -e LTO_CLANG_THIN --set-str LOCALVERSION -nuwa-port
          make O=out LLVM=1 ARCH=arm64 olddefconfig
          grep -E 'CONFIG_(VT|FB_|FBDEV|MODULE_FORCE|TRIM_UNUSED|LOCALVERSION)' out/.config || true
          mkdir -p gki && touch gki/abi_symbollist.raw
          make O=out LLVM=1 ARCH=arm64 -j$(nproc) Image 2>&1 | tail -80
          ls -la out/arch/arm64/boot/
          cd ..
          python3 repack.py k/out/arch/arm64/boot/Image boot.img
          sha256sum boot.img
      - uses: actions/upload-artifact@v4
        with:
          name: nuwa-boot
          path: |
            boot.img
            k/out/.config
